  <style>
    :root {
      --bg-black: #03060c;
      --bg-navy: #071226;
      --gold: #d2ae6d;
      --gold-bright: #f3dba6;
      --gold-deep: #9c793e;
      --blue: #29b6ff;
      --blue-soft: rgba(41, 182, 255, 0.25);
      --white: #f8fafc;
      --muted: #b2c3df;
      --crimson: #e05263;
      --emerald: #34d399;
      --panel-bg: rgba(7, 17, 36, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020408;
      color: var(--white);
      font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #theater-viewport {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #0c1d3d 0%, #03050a 72%, #010205 100%);
      overflow: hidden;
      position: relative;
    }

    #cinema-stage {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      background: var(--bg-black);
      overflow: hidden;
      box-shadow: 0 32px 110px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(41, 182, 255, 0.22), 0 0 0 2px rgba(210, 174, 109, 0.16);
      container-type: inline-size;
    }
